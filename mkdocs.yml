site_name: Databricks Mastery Path
site_description: A free Databricks course — the lakehouse, Spark on Databricks, Delta Lake, Unity Catalog, Auto Loader, Lakeflow pipelines, workflows, Databricks SQL, MLflow, Asset Bundles and cost control.
site_url: https://sigilipelli.github.io/databricks-mastery-path/
repo_url: https://github.com/sigilipelli/databricks-mastery-path
repo_name: databricks-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Lakehouse & Spark Foundations":
      - Overview: level-1/index.md
      - "01 · The Lakehouse: Control Plane, Compute Plane & Storage": level-1/01-lakehouse-architecture.md
      - "02 · Workspaces, Compute Types & Notebooks": level-1/02-workspace-compute.md
      - "03 · Spark DataFrames: Transformations & Actions": level-1/03-spark-dataframes.md
      - "04 · Spark SQL, Built-in Functions & Window Functions": level-1/04-spark-sql-functions.md
      - "05 · Reading & Writing Files: Formats, Schemas & Modes": level-1/05-reading-writing-data.md
      - "06 · Delta Lake Tables: Create, Read, Update, Delete": level-1/06-delta-lake-basics.md
      - "07 · Inside the Delta Log: Transactions & ACID": level-1/07-delta-log-acid.md
      - "08 · Time Travel, RESTORE & VACUUM": level-1/08-time-travel-restore-vacuum.md
      - "09 · Tables, Views & Volumes: Where Data Lives": level-1/09-catalog-tables-volumes.md
